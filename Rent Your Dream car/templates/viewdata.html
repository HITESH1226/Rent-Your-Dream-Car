<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registered CarRent users.">
    <meta name="theme-color" content="#09070f">
    <meta name="robots" content="noindex, nofollow">
    <title>Registered users · CarRent</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Sleek Purple CarRent Logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
<main id="main" class="page" style="padding-top:40px">
    <div class="container">
        <div class="admin-head">
            <div>
                <span class="eyebrow">Administration</span>
                <h1 class="section-title mb-0">Registered <span class="text-accent">users</span></h1>
                <p class="text-muted mb-0 small">{{ data|length }} account{{ '' if data|length == 1 else 's' }}</p>
            </div>
            <a href="/" class="btn btn-outline-custom btn-sm">View site</a>
        </div>
        <div class="glass-card table-card">
            <table class="data-table stack-table">
                <thead><tr><th>ID</th><th>Full name</th><th>Email</th><th>Contact</th><th>City</th></tr></thead>
                <tbody>
                    {% for i in data %}
                    <tr>
                        <td data-label="ID">{{ i[0] }}</td>
                        <td data-label="Name"><strong>{{ i[1] }}</strong></td>
                        <td data-label="Email">{{ i[2] }}</td>
                        <td data-label="Contact">{{ i[4] }}</td>
                        <td data-label="City">{{ i[5] }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center text-muted py-4">No users yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
