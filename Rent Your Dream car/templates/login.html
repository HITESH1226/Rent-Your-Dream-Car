<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to CarRent to book cars and manage your bookings.">
    <meta name="theme-color" content="#09070f">
    <title>Log in · CarRent</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Sleek Purple CarRent Logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reg.css') }}">
</head>
<body>
<main id="main" class="auth-wrap">
    <div class="auth-card glass-card">
        <a href="/" class="auth-back"><i class="bi bi-arrow-left"></i> Back to home</a>
        <img class="auth-logo" src="{{ url_for('static', filename='images/Sleek Purple CarRent Logo.png') }}" alt="CarRent logo">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to book a car and manage your bookings.</p>

        {% if error %}
        <div class="alert alert-dark-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('logincheck') }}" method="post" novalidate data-validate>
            <div class="mb-3">
                <label class="field-label" for="email">Email</label>
                <input class="form-control-dark" id="email" type="email" name="email" placeholder="you@example.com"
                       autocomplete="email" required autofocus>
                <div class="field-error">Please enter a valid e-mail address.</div>
            </div>
            <div class="mb-4">
                <label class="field-label" for="password">Password</label>
                <div class="input-wrap">
                    <input class="form-control-dark" id="password" type="password" name="password" placeholder="Enter your password"
                           autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <div class="field-error">Please enter your password.</div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-3" data-loading-text="Signing in…">Log in</button>
        </form>
        <p class="auth-links">Don't have an account? <a href="/reg">Create one</a></p>
    </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
