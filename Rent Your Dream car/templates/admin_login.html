<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CarRent administrator sign-in.">
    <meta name="theme-color" content="#09070f">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin login · CarRent</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Sleek Purple CarRent Logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reg.css') }}">
</head>
<body>
<main id="main" class="auth-wrap">
    <div class="auth-card glass-card">
        <a href="/" class="auth-back"><i class="bi bi-arrow-left"></i> Back to site</a>
        <div class="feature-icon mx-auto" style="width:64px;height:64px;font-size:1.8rem"><i class="bi bi-shield-lock-fill"></i></div>
        <h1>Admin login</h1>
        <p class="auth-sub">Sign in to manage bookings.</p>

        {% if error %}
        <div class="alert alert-dark-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" novalidate data-validate>
            <div class="mb-3">
                <label class="field-label" for="username">Username</label>
                <input class="form-control-dark" id="username" name="username" type="text" autocomplete="username" required autofocus>
                <div class="field-error">Please enter your username.</div>
            </div>
            <div class="mb-4">
                <label class="field-label" for="password">Password</label>
                <div class="input-wrap">
                    <input class="form-control-dark" id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                </div>
                <div class="field-error">Please enter your password.</div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-3" data-loading-text="Signing in…">Log in</button>
        </form>
    </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
